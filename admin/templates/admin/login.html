{% extends "admin/base.html" %}

{% block title %}Login{% endblock %}

{% block content %}
<style>
  .login-wrap {
    max-width: 380px;
    margin: 80px auto 0;
  }
  .login-title {
    text-align: center;
    font-size: 22px;
    font-weight: 700;
    margin-bottom: 28px;
    color: #2d3748;
  }
  .form-group { margin-bottom: 16px; }
  label {
    display: block;
    font-size: 13px;
    font-weight: 600;
    color: #4a5568;
    margin-bottom: 6px;
  }
  input[type="password"] {
    width: 100%;
    padding: 10px 14px;
    border: 1px solid #e2e8f0;
    border-radius: 6px;
    font-size: 14px;
    outline: none;
    transition: border-color 0.15s;
  }
  input[type="password"]:focus { border-color: #3182ce; }
  .btn {
    display: block;
    width: 100%;
    padding: 11px;
    background: #3182ce;
    color: #fff;
    border: none;
    border-radius: 6px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    margin-top: 20px;
  }
  .btn:hover { background: #2b6cb0; }
  .error {
    background: #fff5f5;
    border: 1px solid #fed7d7;
    color: #c53030;
    padding: 10px 14px;
    border-radius: 6px;
    font-size: 13px;
    margin-bottom: 16px;
  }
</style>

<div class="login-wrap">
  <div class="card">
    <div class="login-title">Admin Login</div>

    {% if error %}
    <div class="error">{{ error }}</div>
    {% endif %}

    <form method="POST">
      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" name="password"
               placeholder="Enter admin password" autofocus required>
      </div>
      <button class="btn" type="submit">Sign in</button>
    </form>
  </div>
</div>
{% endblock %}
