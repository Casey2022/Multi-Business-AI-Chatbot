{% extends "admin/base.html" %}

{% block title %}Sign in{% endblock %}

{# No session yet, so the nav has nothing to link to. #}
{% block navlinks %}{% endblock %}

{% block content %}
<div class="login-wrap">
  <div class="login-card card">
    <div class="card-title login-title">Sign in</div>

    <form method="POST">
      {% if error %}
        <div class="field"><div class="flash flash-error">{{ error }}</div></div>
      {% endif %}

      <div class="field">
        <label for="email">Email</label>
        <input type="email" id="email" name="email" autocomplete="username"
               placeholder="you@example.com" autofocus required>
      </div>

      <div class="field">
        <label for="password">Password</label>
        <input type="password" id="password" name="password"
               autocomplete="current-password" placeholder="Your password" required>
      </div>

      <div class="field">
        <button class="btn btn-primary w-full" type="submit">Sign in</button>
      </div>
    </form>
  </div>
</div>
{% endblock %}
