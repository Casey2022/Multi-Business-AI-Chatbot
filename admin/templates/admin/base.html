<!DOCTYPE html>
{% import "admin/_macros.html" as ui %}
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}Admin{% endblock %} — Simon Says</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Jost:wght@300;400;500;600;700&display=swap">

  {# Every visual decision lives in this one file. It used to live in a
     <style> block copied into this template plus 167 inline style
     attributes across the other nine. #}
  <link rel="stylesheet" href="{{ url_for('static', filename='app.css') }}">
  {# Demo visitors only (analytics.py): never a real owner's portal, the
     operator's, or a signed-out page like the reset link's. #}
  {% if viewer and viewer.email.endswith('@demo.invalid') %}{% include "_analytics.html" %}{% endif %}
</head>
<body>

<nav class="topnav">
  {# The wordmark goes home, and home depends on who you are: an operator
     has a list of businesses, an owner has one business. See the `viewer`
     context processor in admin/auth.py. #}
  {% if home_url %}
    <a href="{{ home_url }}" class="wordmark">Simon<em> Says</em></a>
  {% else %}
    <span class="wordmark">Simon<em> Says</em></span>
  {% endif %}

  <div class="nav-links">
    {# The login page has no session, so "Log out" would be a link to
       nowhere. It empties this block. #}
    {% block navlinks %}
    {# Only an operator has more than one business to switch between. To an
       owner — and to a demo visitor — "Businesses" is a link to a page that
       exists to bounce them straight back here. #}
    {% if is_operator %}
      <a class="nav-link" href="{{ url_for('admin.dashboard') }}">Businesses</a>
    {% endif %}

    {% if business is defined and business %}
      {# The way to see what a change did. An owner who edits a greeting
         wants to watch the bot say it. #}
      <a class="btn btn-primary" target="_blank" rel="noopener"
         href="{{ url_for('chat_page', slug=business.slug) }}"{{ ui.tip(business.is_demo, 3, "See what changed",
         "Opens the customer chat in a new tab, so you can try each change the way a customer would.") }}>Chat as a customer</a>

      {% if business.is_demo %}
        <a class="nav-link" href="{{ url_for('demo_picker') }}">Try a different business</a>
      {% endif %}
    {% endif %}

    {# Starting a demo signs you in as that sandbox's owner. Without this,
       someone who was already logged in finds their own dashboard
       redirecting them into a business they don't recognise, with nothing
       explaining it. #}
    {% if displaced_user %}
      <a class="nav-link" href="{{ url_for('demo_leave') }}">Back to your account</a>
    {% endif %}

    {# Owners ask for help from any page, and the page they were on goes
       with the request. Operators get the inbox those requests land in. #}
    {% if viewer %}
      {% if is_operator %}
        {% set open_count = open_support_count() %}
        <a class="nav-link" href="{{ url_for('admin.support_inbox') }}">Support{% if open_count %}
          <span class="nav-count">{{ open_count }}</span>{% endif %}</a>
      {% else %}
        <a class="nav-link" href="{{ url_for('admin.help_page', **{'from': request.path}) }}"{{ ui.tip(business is defined and business and business.is_demo, 10, "Tell us what you think",
           "Something confusing, broken or impressive? This goes straight to the person who built Simon Says.") }}>{{ 'Help & feedback' if business is defined and business and business.is_demo else 'Help' }}</a>
      {% endif %}
    {% endif %}

    {% if viewer %}
      <a class="nav-link" href="{{ url_for('admin.guide') }}">Guide</a>
    {% endif %}
    {% if viewer and not viewer.email.endswith('@demo.invalid') %}
      <a class="nav-link" href="{{ url_for('admin.change_password') }}">Password</a>
    {% endif %}
    <a class="nav-link" href="{{ url_for('admin.logout') }}">Log out</a>
    {% endblock %}
  </div>
</nav>

<div class="page">
  {% if business is defined and business and business.is_demo %}
    <div class="demobar">
      <span class="chip chip-pending">Demo</span>
      <span>
        This is a sandbox copy of {{ business.name }}, yours alone. Change
        anything you like — it's cleared when you're done and touches no
        real business.
        {% if displaced_user %}
          You're signed in as this demo, not as {{ displaced_user }}.
        {% endif %}
        <button type="button" class="tour-again" data-tour-restart hidden>Show the tour again</button>
      </span>
    </div>
  {% endif %}

  {% if business is defined and business and business.id %}
    {% set paused_info = booking_pause(business) %}
    {% if paused_info %}
      {# A switch an owner can forget: say so on every page while it's off. #}
      <div class="banner">
        <div><strong>New bookings are paused{% if paused_info.resume_on %} until
          {{ paused_info.resume_on.strftime('%A, %B %-d') }}{% endif %}.</strong>
          <div class="cell-sub">Customers who ask to book are told: “{{ paused_info.reply }}”</div>
        </div>
        <div class="banner-actions">
          <a class="btn" href="{{ url_for('admin.settings', business_id=business.id) }}#bookings">Change</a>
        </div>
      </div>
    {% endif %}
  {% endif %}

  {% with messages = get_flashed_messages(with_categories=true) %}
    {% for category, message in messages %}
      <div class="flash flash-{{ category if category in ('error', 'warning') else 'success' }}">
        {{ message }}
      </div>
    {% endfor %}
  {% endwith %}

  {% block content %}{% endblock %}
</div>

{% set ap = assistant_panel() %}
{% if ap %}{% include "admin/_assistant_pop.html" %}{% endif %}

{# Progressive enhancement: any <table data-resizable> gets draggable
   column edges, remembered per table. The tables work without it. #}
<script src="{{ url_for('static', filename='confirm-submit.js') }}" defer></script>
<script src="{{ url_for('static', filename='table-resize.js') }}" defer></script>
<script src="{{ url_for('static', filename='field-deps.js') }}" defer></script>
<script src="{{ url_for('static', filename='rule-cards.js') }}" defer></script>
<script src="{{ url_for('static', filename='date-picker.js') }}" defer></script>
<script src="{{ url_for('static', filename='unsaved-edits.js') }}" defer></script>
<script src="{{ url_for('static', filename='photo-upload.js') }}" defer></script>
<script src="{{ url_for('static', filename='row-order.js') }}" defer></script>
<script src="{{ url_for('static', filename='busy-submit.js') }}" defer></script>
<script src="{{ url_for('static', filename='assistant-pop.js') }}" defer></script>
{# Tips for demo visitors; a real owner's page doesn't load it. #}
{% if business is defined and business and business.is_demo %}
<script src="{{ url_for('static', filename='demo-tour.js') }}" defer></script>
{% endif %}

</body>
</html>
