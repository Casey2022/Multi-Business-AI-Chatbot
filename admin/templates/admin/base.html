<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}Admin{% endblock %} — Simon Says</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800&family=Public+Sans:wght@400;500;600&display=swap">

  {# Every visual decision lives in this one file. It used to live in a
     <style> block copied into this template plus 167 inline style
     attributes across the other nine. #}
  <link rel="stylesheet" href="{{ url_for('static', filename='app.css') }}">
</head>
<body>

<nav class="topnav">
  {# The wordmark goes home, and home depends on who you are: an operator
     has a list of businesses, an owner has one business. See the `viewer`
     context processor in admin/auth.py. #}
  {% if home_url %}
    <a href="{{ home_url }}" class="wordmark">Simon<em> Says</em></a>
  {% else %}
    <span class="wordmark">Simon<em> Says</em></span>
  {% endif %}

  <div class="nav-links">
    {# The login page has no session, so "Log out" would be a link to
       nowhere. It empties this block. #}
    {% block navlinks %}
    {# Only an operator has more than one business to switch between. To an
       owner — and to a demo visitor — "Businesses" is a link to a page that
       exists to bounce them straight back here. #}
    {% if is_operator %}
      <a class="nav-link" href="{{ url_for('admin.dashboard') }}">Businesses</a>
    {% endif %}

    {% if business is defined and business %}
      {# The way to see what a change did. An owner who edits a greeting
         wants to watch the bot say it. #}
      <a class="btn btn-primary" target="_blank" rel="noopener"
         href="{{ url_for('chat_page', slug=business.slug) }}">Chat as a customer</a>

      {% if business.is_demo %}
        <a class="nav-link" href="{{ url_for('demo_picker') }}">Try a different business</a>
      {% endif %}
    {% endif %}

    {# Starting a demo signs you in as that sandbox's owner. Without this,
       someone who was already logged in finds their own dashboard
       redirecting them into a business they don't recognise, with nothing
       explaining it. #}
    {% if displaced_user %}
      <a class="nav-link" href="{{ url_for('demo_leave') }}">Back to your account</a>
    {% endif %}

    <a class="nav-link" href="{{ url_for('admin.logout') }}">Log out</a>
    {% endblock %}
  </div>
</nav>

<div class="page">
  {% if business is defined and business and business.is_demo %}
    <div class="demobar">
      <span class="chip chip-pending">Demo</span>
      <span>
        This is a sandbox copy of {{ business.name }}, yours alone. Change
        anything you like — it's cleared when you're done and touches no
        real business.
        {% if displaced_user %}
          You're signed in as this demo, not as {{ displaced_user }}.
        {% endif %}
      </span>
    </div>
  {% endif %}

  {% with messages = get_flashed_messages(with_categories=true) %}
    {% for category, message in messages %}
      <div class="flash flash-{{ 'error' if category == 'error' else 'success' }}">
        {{ message }}
      </div>
    {% endfor %}
  {% endwith %}

  {% block content %}{% endblock %}
</div>

{# Progressive enhancement: any <table data-resizable> gets draggable
   column edges, remembered per table. The tables work without it. #}
<script src="{{ url_for('static', filename='table-resize.js') }}" defer></script>
<script src="{{ url_for('static', filename='field-deps.js') }}" defer></script>

</body>
</html>
