# config/sunrise_bakery_and_cafe.yaml — Sunrise Bakery & Café

business:
  name: "Sunrise Bakery & Café"
  # The identifier. Stated, not derived from the name above:
  # the name is owner-editable and only accidentally looks
  # like an identifier. Must match the registered slug.
  slug: "sunrise_bakery_and_cafe"
  phone: "(585) 555-0188"
  address: "47 Park Ave, Rochester NY"
  service_area: "Pickup at the shop, delivery within 5 miles for orders over $50"

services:
  - "custom birthday cakes"
  - "wedding cakes"
  - "cupcake orders (dozen minimum)"
  - "pastry trays for events"
  # The knowledge base says a dozen muffins can be ordered ahead; without
  # this, "a dozen blueberry muffins" was booked as "cupcake orders (dozen
  # minimum)", the nearest service (journey_eval, 2026-10-20).
  - "muffins by the dozen"

# The menu: the ONLY copy of this business's prices (2026-10-11). The
# knowledge-base sections keep everything else (notice, flavours, timing);
# each section's price line is generated from here, and price questions are
# answered by the menu_price tool, which matches what was asked in code. See
# config/crosstown_pizza.yaml for the fields; besides fixed prices:
#   {from: 110}            a starting price ("from $110")
#   {from: 20, to: 60}     a range
#   {quote: "…"}           no figure: said as written
#   each / sold_by / minimum / packs   for things sold by the piece
#   notes                  said with the price (and some change it)
# Prices live on the Menu page (owner Settings: "Prices on a menu?").
menu_enabled: true
menu:
  - item: birthday cake
    aliases: [birthday cakes, custom cake, custom cakes, kids cake, standard cake]
    section: "Custom Birthday Cakes"
    options:
      6-inch: 45
      12-inch: 120
    notes:
      6-inch: "serves 6-8"
      12-inch: "serves 30-40"
    add_ons:
      custom design, theme or character:
        prices:
          any: {from: 20, to: 60}
  - item: wedding cake
    aliases: [wedding cakes]
    section: "Wedding Cakes"
    options:
      small two-tier: {from: 400}
      elaborate multi-tier: {from: 1500}
  - item: standard cupcake
    aliases: [cupcake, cupcakes, standard cupcakes, regular cupcake, regular cupcakes]
    section: "Cupcake Orders"
    each: 3.50
    sold_by: 12
  - item: specialty filled cupcake
    aliases: [filled cupcake, filled cupcakes, specialty cupcake, specialty cupcakes]
    section: "Cupcake Orders"
    each: 4.50
    notes:
      each: "lemon curd, salted caramel or raspberry jam"
  - item: mini cupcake
    aliases: [mini cupcakes, minis]
    section: "Cupcake Orders"
    each: 2.25
    minimum: 12
  - item: themed cupcake display
    aliases: [cupcake display, cupcake displays, themed display, themed cupcakes]
    section: "Cupcake Orders"
    options:
      24 cupcakes: {from: 80}
  - item: pastry tray
    aliases: [pastry trays, breakfast tray, catering tray]
    section: "Pastry Trays for Events"
    options:
      for 8-12 people: 65
      for 20-25 people: 140
  - item: muffin
    aliases: [muffins]
    section: "Muffins and Daily Pastries"
    each: 3.25
    packs:
      12: 35

# Deposits and cancellation, as data (2026-09-30). This is the ONLY copy:
# the knowledge document's "Deposits and Cancellation" section was removed.
# policy.py renders the text the bot reads from these numbers, and the
# cancellation_outcome tool applies them, so the model never has to work out
# which window "three days before" falls in, or what 25% of what is kept.
# A week of rewording the prose section moved the wrong answer from one
# question to another; see notes/conversation_defects.md.
#
# Windows: a cancellation falls in the first window whose at_least_hours it
# reaches. Exactly 7 days before counts as "7 days or more" (the old text
# said "more than 7" and "less than 7" and left exactly 7 to guess).
# Outcomes: refund_deposit, forfeit_deposit, charge_full_price,
# {keep_percent: N} (N% of the order price kept, the rest of what was paid
# refunded).
policies:
  cancellation:
    title: "Deposits and cancellation"
    what: "cake"
    before: "the order date"
    deposits:
      custom cake:  {percent: 50, when: "paid at ordering"}
      wedding cake: {min_percent: 25}
    windows:
      - at_least_hours: 168          # 7 days
        custom cake: refund_deposit
        wedding cake: {keep_percent: 25}
      - at_least_hours: 48
        any: forfeit_deposit
      - at_least_hours: 0
        any: charge_full_price

calendar:
  enabled: true
  calendar_id: "2d9f6f7490b6cbdc8c6b25021ec393b12b21264b8d369861fbc6a45122c79a11@group.calendar.google.com"
  timezone: "America/New_York"
  default_duration_minutes: 30      # a pickup, not a job
  scheduling:
    model: "capacity"               # several pickups can share a slot
    slots_per_time: 3
    buffer_minutes: 0               # no travel time — they're behind a counter
    slot_granularity: 30
    max_alternatives: 3
    business_hours:                 # the only copy (scheduling.hours_text makes the text); 0 = Monday ... 6 = Sunday; omit = closed
      1: ["07:00", "15:00"]
      2: ["07:00", "15:00"]
      3: ["07:00", "15:00"]
      4: ["07:00", "15:00"]
      5: ["07:00", "15:00"]
      6: ["07:00", "15:00"]

bot:
  persona_preset: "warm" 
  # The shared rules named below, and the channel rules, are in
  # config/defaults.yaml; these words fill their blanks.
  words:
    who: "customer"
    offer: "services"
    never_invent: |-
      flavors, ingredients, allergens, or policies you don't see here.
  guardrails:
    universal:
      - rule: facts_only
      - |
        Never apply a fact from one service to a different service —
        notice periods, prices, and policies are service-specific. If a
        policy isn't stated for a specific service, say you're not sure
        and give the phone number.
      - rule: unsure
      - |
        For custom cake orders, always direct them to call to discuss
        flavor, size, design, and dietary needs.
        You cannot cancel, modify, or look up existing orders. If a
        customer asks to cancel or change an order that's already been
        placed, tell them to call {phone} — never confirm a cancellation
        or change yourself.
      - rule: no_engaging

rules:
  - name: "greeting"
    keywords: ["hi", "hello", "hey", "yo"]
    match: "exact"
    reply: "Hi there! 👋 Welcome to {business_name}. How can I help?"

  - name: "hours"
    # Phrases, not the bare word: "hours" alone also matched "my appointment
    # is in about 30 hours, what happens if I cancel?" and answered with the
    # opening times (journey_eval, 2026-10-17). rules_shortcuts_test.py checks it.
    keywords: ["your hours", "opening hours", "business hours", "store hours", "hours of operation", "what are the hours", "you open", "are you closed", "you close"]
    match: "any"
    reply: "We're open {hours}."

  - name: "location"
    keywords: ["where are you", "your location", "your address", "directions"]
    match: "any"
    reply: "We're at {address}. Stop in for a 🥐!"

  - name: "thanks"
    keywords: ["thanks", "thank you", "thx"]
    match: "any"
    reply: "You're welcome! 😊"

  - name: "cancel_existing"
    keywords: ["cancel my order", "change my order", "cancel my appointment"]
    match: "any"
    # Steps aside when the customer asks what cancelling costs: the model answers
    # from the cancellation rules or the knowledge base (rules_shortcuts_test.py).
    unless: ["charge", "charged", "charges", "fee", "fees", "cost", "costs", "pay",
             "refund", "refunded", "deposit", "penalty", "how much", "what happens",
             "notice", "policy", "money back"]
    reply: "To cancel or change an existing order, please call us at {phone} and we'll take care of it right away."

booking:
  noun: "order"
  noun_plural: "orders"
  # Notice each service needs, in hours before the pickup (policy.notice_for,
  # notes/booking_notice.md): the ONLY copy. The booking flow refuses a time
  # inside it; `section` is where the knowledge base shows its generated
  # line; `words` are how check_notice knows a question is about it (the
  # number is a floor). Keys match `services` above.
  # `variants`: the same service needing longer when the order's own words
  # name it ("gluten free"), with the name it's said by and any other
  # sections its line belongs in. The longest one named wins.
  notice:
    custom birthday cakes:
      hours: 72
      section: "Custom Birthday Cakes"
      words: [custom cake, birthday cake]
      variants:
        - {words: [gluten free], hours: 96, name: "gluten-free cakes",
           sections: ["Flavors and Fillings Available"]}
    wedding cakes: {hours: 336, section: "Wedding Cakes", words: [wedding cake]}
    cupcake orders (dozen minimum):
      hours: 24
      section: "Cupcake Orders"
      words: [cupcake]
      variants:
        - {words: [themed, display, arrangement], hours: 72,
           name: "themed cupcake displays"}
    pastry trays for events: {hours: 48, section: "Pastry Trays for Events",
                              words: [pastry tray, breakfast tray, catering tray]}
    muffins by the dozen:
      hours: 24
      section: "Muffins and Daily Pastries"
      words: [muffin]
      variants:
        - {words: [gluten free], hours: 96, name: "gluten-free muffins",
           sections: ["Allergens and Dietary Notes"]}
  greeting: "Happy to help you place an order! What would you like? (e.g. {services_examples})"
  service_confirmation: "Got it — {service}."
  ask_datetime: "When would you like it ready? (e.g. 'Tuesday at 3pm' or 'next Friday morning')"
  final_confirmation: "Perfect! Order placed: {service} on {datetime}. We'll call to confirm. To change or cancel, just give us a call at {phone}."
  fallback_after_bad_date: "Sorry, I couldn't read that as a date and time. Try something like 'Tuesday at 3pm' or 'June 5 at 10am'."
  cancel_reply: "No problem — order cancelled. Text 'order' anytime to start again."
  extra_questions:
    - key: "customization"
      prompt: "Any customization details? (e.g. 'Happy Birthday Carl', colors, theme — or reply 'none')"
    - key: "notes"
      prompt: "Anything else we should know? (allergies, pickup person — or reply 'none')"